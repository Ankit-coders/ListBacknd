version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: mysql_db_docker2
    restart: always

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: "W7301@jqir#"
      MYSQL_DATABASE: "synctubes"

    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_new
    restart: always

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: "W7301@jqir#"

    depends_on:
      - mysql

  springboot:
    build: .
    container_name: springboot_app_new
    restart: always

    ports:
      - "8089:8089"

    depends_on:
      - mysql

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: synctubes
      MYSQL_USER: root
      MYSQL_PASSWORD: "W7301@jqir#"

    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql_data: